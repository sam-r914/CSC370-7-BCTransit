
services:
  db:
    # 1. Use the official MySQL base image
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: myrootpassword
      MYSQL_DATABASE: bctransit
      MYSQL_USER: myuser
      MYSQL_PASSWORD: mypassword
    ports:
      - "3307:3306"
    volumes:
      #auto-init SQL scripts
      - ./init_schema.sql:/docker-entrypoint-initdb.d/init_schema.sql
      - ./load_data.sql:/docker-entrypoint-initdb.d/load_data.sql
      - ./sload_conditional_data.sql:/docker-entrypoint-initdb.d/sload_conditional_data.sql
      - ./BCT-data:/var/lib/mysql-files/BCT-data
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s

  data_export:
    image: mysql:latest
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/output
      - ./export_tables.sh:/export_tables.sh
    entrypoint: ["sh", "-c", "tail -f /dev/null"]